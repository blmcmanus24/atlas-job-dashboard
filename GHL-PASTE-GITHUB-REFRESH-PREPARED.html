function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted;}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);if(row.some(x=>x.trim()))rows.push(row);row=[];cell=''}else cell+=c;}if(quoted)throw Error('Unclosed quoted field');if(cell||row.length){row.push(cell);rows.push(row)}return rows;}
$('coordinates').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;const rows=parseCSV(await file.text()),head=rows.shift().map(x=>x.trim().replace(/^\uFEFF/,'').toLowerCase());const wi=head.indexOf('work order'),la=head.indexOf('latitude'),lo=head.indexOf('longitude');if([wi,la,lo].includes(-1))throw Error('Required headers: Work Order, Latitude, Longitude');let n=0,rejected=0;const next={...coordinates};for(const r of rows){const id=(r[wi]||'').trim(),lat=Number(r[la]),lon=Number(r[lo]);if(!r[la]?.trim()||!r[lo]?.trim()||!jobs.some(j=>j['Work Order']===id)||!Number.isFinite(lat)||!Number.isFinite(lon)||Math.abs(lat)>90||Math.abs(lon)>180){rejected++;continue}next[id]={lat,lon,provider:'Local coordinate import'};n++;}coordinates=next;$('importMessage').textContent=`${n} coordinate rows imported; ${rejected} rejected. Imports last for this browser session only.`;render()}catch(err){$('importMessage').textContent='Import failed: '+err.message}};

async function refreshTable(){
 if(!endpoint){connectionStatus('GitHub/Zapier refresh setup is pending.');return;}
 if(refreshBusy)return;refreshBusy=true;refreshButton.disabled=true;const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),25000);
 try{
 const response=await fetch(endpoint+'?ref=main&refresh='+Date.now(),{method:'GET',mode:'cors',credentials:'omit',cache:'no-store',headers:{Accept:'application/vnd.github.raw+json'},signal:controller.signal});
 if(response.status===401&&typeof atlasRequireLogin==='function'){atlasRequireLogin();return;}
 if(response.status===403||response.status===429)throw Error('GitHub access or request limit blocked the read');if(!response.ok)throw Error('Table reader is unavailable');const payload=await response.json();
 if(payload.source!=='zapier-table'||!Array.isArray(payload.jobs)||!payload.coordinates||typeof payload.coordinates!=='object'||!Number.isFinite(Date.parse(payload.lastSuccessfulRefresh)))throw Error('Unexpected table response');
 const seen=new Set();for(const job of payload.jobs){for(const key of ['Customer','Address','Job Type','Status','Work Order','Scheduled Date','Job Amount USD','Job Description','Address Note','Possible Addresses','Warranty Flag','Map Category'])if(typeof job[key]!=='string')throw Error('Invalid job schema');if(!job['Work Order']||seen.has(job['Work Order']))throw Error('Invalid work-order key');seen.add(job['Work Order']);}
 for(const [id,c]of Object.entries(payload.coordinates))if(!seen.has(id)||!Number.isFinite(c.lat)||!Number.isFinite(c.lon)||Math.abs(c.lat)>90||Math.abs(c.lon)>180)throw Error('Invalid coordinates');
 // Swap only after validating the full payload. An empty complete pull is valid.
 atlasLastRequestId=payload.publicationRequestId||'';jobs=payload.jobs.map(normalizeJob);coordinates={...payload.coordinates};lastTableSuccess=payload.lastSuccessfulRefresh;updateMenus();render();
 const viaGitHub=payload.delivery==='github';
 const when=new Intl.DateTimeFormat('en-US',{timeZone:'America/Chicago',month:'short',day:'numeric',hour:'numeric',minute:'2-digit',second:'2-digit',timeZoneName:'short'}).format(new Date(lastTableSuccess));
 connectionStatus(`${payload.stale?'Refresh failed · showing last successful table read':viaGitHub?'Zapier data published through GitHub':'Connected to Zapier Tables'} · Updated ${when}${payload.warnings?.length?' · Data notes need review':''}`);
 root.querySelector('.snapshot').textContent=payload.stale?'TABLE DATA · STALE':'ZAPIER TABLES';
 root.querySelector('.source b').textContent=payload.stale?'Last successful table read':onDemand?'Pulls the current table when you press Refresh':viaGitHub?'Checks published data every minute':'Refreshes every minute while open';

 root.querySelector('footer').textContent='Zapier table reader · no changes are written to Markate or Zapier.';
 }catch{
 connectionStatus(lastTableSuccess?`Refresh unavailable · retaining the last successful table read (${new Date(lastTableSuccess).toLocaleString('en-US',{timeZone:'America/Chicago'})} Chicago time).`:'No published job data has been verified yet.');
 if(lastTableSuccess)root.querySelector('.snapshot').textContent='TABLE DATA · STALE';
 }finally{clearTimeout(timeout);refreshBusy=false;refreshButton.disabled=false;}
}
async function atlasRefreshCurrentJobs(){
 if(!endpoint||!atlasRefreshHookUrl){connectionStatus('Refresh is not active: the Zapier publisher webhook still needs configuration.');return;}
 if(refreshBusy)return;
 refreshButton.disabled=true;connectionStatus('Requesting a fresh Zapier table read and GitHub publication…');
 const requestId=crypto.randomUUID(),controller=new AbortController(),timer=setTimeout(()=>controller.abort(),15000);
 try{
 const response=await fetch(atlasRefreshHookUrl,{method:'POST',mode:'cors',credentials:'omit',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'request_id='+encodeURIComponent(requestId),signal:controller.signal});
 if(!response.ok)throw Error('Refresh request was not accepted');
 const deadline=Date.now()+180000;
 while(Date.now()<deadline){
  await refreshTable();refreshButton.disabled=true;
  if(atlasLastRequestId===requestId){connectionStatus('Current Zapier jobs published through GitHub · '+new Date(lastTableSuccess).toLocaleString('en-US',{timeZone:'America/Chicago'}));return;}
  connectionStatus('Zapier refresh requested · waiting for a newer GitHub publication. Previously published data may still be displayed.');
  await new Promise(resolve=>setTimeout(resolve,15000));
 }
 throw Error('No newer publication was confirmed. GitHub caching or the Zap may be delaying the update.');
 }catch(error){connectionStatus(error.name==='AbortError'?'Refresh request timed out; no fresh publication confirmed.':error.message);}
 finally{clearTimeout(timer);refreshButton.disabled=false;}
}
refreshButton.onclick=atlasRefreshCurrentJobs;
if(onDemand)connectionStatus(endpoint?'Press Refresh table to request a current Zapier read and wait for GitHub publication.':'Setup pending · Refresh is inactive. No customer data is included in this page.');
else refreshTable();
root.querySelector('.snapshot').textContent='SETUP PENDING';root.querySelector('.source b').textContent='No customer data loaded';root.querySelector('.snapshotNotes .notice').textContent='This updated page contains no embedded job records. The GitHub data file is public. Refresh can be activated after the Zapier publisher webhook is configured and verified.';
const refreshTimer=onDemand?null:setInterval(()=>{if(document.visibilityState==='visible')refreshTable()},60000);

// No localStorage, IndexedDB or service worker: last-good job data lasts only in page memory.
